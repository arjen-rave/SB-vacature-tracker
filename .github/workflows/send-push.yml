name: Send vacature-tracker push reminder

on:
  # No schedule/cron trigger here either — GitHub's own scheduler proved
  # unreliable for Arjen's own vacature-tracker repo, so this one is also
  # triggered via workflow_dispatch by its Cowork scheduled task, which runs
  # twice a week (Monday and Thursday) rather than daily, and clicks "Run
  # workflow" after every successful check — or manually by Arjen/SB.
  workflow_dispatch:
    inputs:
      test_send:
        description: "Send a one-off test notification to every current subscriber, without checking data.json's timestamp."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: .github/scripts
        run: npm install web-push
      - name: Send push notification
        working-directory: .github/scripts
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_SEND: ${{ inputs.test_send }}
          SITE_URL: "https://arjen-rave.github.io/SB-vacature-tracker/"
        run: node send-push.js
